<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" font-family="Verdana, Geneva, sans-serif">
  <rect width="860" height="620" fill="#FFFFFF"/>

  <!-- título -->
  <text x="430" y="46" text-anchor="middle" font-size="21" font-weight="bold" fill="#1B2A5B">La IA propone, el equipo decide</text>

  <!-- flechas del ciclo (sentido horario) -->
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#53595F"/>
    </marker>
  </defs>
  <path d="M 545 150 Q 660 190 665 290" fill="none" stroke="#53595F" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M 660 415 Q 640 480 545 505" fill="none" stroke="#53595F" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M 315 505 Q 220 480 200 415" fill="none" stroke="#53595F" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M 195 290 Q 200 190 315 150" fill="none" stroke="#53595F" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- 1 arriba: propone el plan (IA) -->
  <rect x="320" y="90" width="220" height="88" rx="12" fill="#2E86C1"/>
  <text x="430" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1 · Propone el plan</text>
  <text x="430" y="153" text-anchor="middle" font-size="12.5" fill="#DCEDF8">y lo divide en pasos</text>

  <!-- 2 derecha: pide aclaración (IA) -->
  <rect x="565" y="300" width="230" height="88" rx="12" fill="#2E86C1"/>
  <text x="680" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2 · Pide aclaración</text>
  <text x="680" y="363" text-anchor="middle" font-size="12.5" fill="#DCEDF8">cuando falta contexto</text>

  <!-- 3 abajo: el equipo aclara y aprueba (equipo) -->
  <rect x="305" y="440" width="250" height="88" rx="12" fill="#7AC143"/>
  <text x="430" y="478" text-anchor="middle" font-size="16" font-weight="bold" fill="#12300A">3 · El equipo aclara</text>
  <text x="430" y="503" text-anchor="middle" font-size="16" font-weight="bold" fill="#12300A">y aprueba</text>

  <!-- 4 izquierda: implementa (IA) -->
  <rect x="65" y="300" width="230" height="88" rx="12" fill="#2E86C1"/>
  <text x="180" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">4 · Implementa</text>
  <text x="180" y="363" text-anchor="middle" font-size="12.5" fill="#DCEDF8">solo lo aprobado</text>

  <!-- centro -->
  <text x="430" y="305" text-anchor="middle" font-size="13" fill="#53595F">El ciclo se repite en cada</text>
  <text x="430" y="325" text-anchor="middle" font-size="13" fill="#53595F">actividad del desarrollo:</text>
  <text x="430" y="345" text-anchor="middle" font-size="13" fill="#53595F">requisitos, diseño, código,</text>
  <text x="430" y="365" text-anchor="middle" font-size="13" fill="#53595F">pruebas, despliegue</text>

  <!-- leyenda -->
  <rect x="255" y="565" width="18" height="18" rx="4" fill="#2E86C1"/>
  <text x="281" y="579" font-size="13" fill="#1B2A5B">lo hace la IA</text>
  <rect x="415" y="565" width="18" height="18" rx="4" fill="#7AC143"/>
  <text x="441" y="579" font-size="13" fill="#1B2A5B">lo hace el equipo</text>
</svg>
